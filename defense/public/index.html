<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>요괴 퇴마 디펜스</title>
  <meta name="theme-color" content="#1a1420">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 첫 화면 -->
  <section id="home" class="screen">
    <div class="card home-card">
      <div class="logo"><img src="/icon.svg" width="104" height="104" alt=""></div>
      <h1>요괴 퇴마 디펜스</h1>
      <p class="sub">둘이서 함께 막는 <b>랜덤 소환 디펜스</b>!<br>퇴마사를 무작위로 소환하고, 같은 유닛 3개를 <b>합성</b>해 신화 등급까지 키워 40웨이브를 버티세요.</p>
      <label class="field">내 이름 <input id="in-name" maxlength="16" placeholder="퇴마사 이름"></label>
      <div class="home-actions">
        <button id="btn-create" class="primary big">🏮 친구와 할 방 만들기</button>
        <div class="join-row"><input id="in-code" maxlength="4" placeholder="방 코드"><button id="btn-join">입장</button></div>
      </div>
      <div class="solo-box">
        <div class="solo-title">혼자 하기</div>
        <div class="solo-row">
          <button class="solo" data-bot="0">🧍 나 혼자</button>
          <button class="solo" data-bot="1">🤖 AI 동료와 둘이서</button>
        </div>
      </div>
      <div class="home-links"><button class="btn-guide link">📖 게임 방법</button><button class="btn-codex link">📚 유닛 도감</button><button class="btn-sound link">🔊 소리</button></div>
      <div id="lan" class="hint"></div>
    </div>
  </section>

  <!-- 대기실 -->
  <section id="room" class="screen hidden">
    <div class="card room-card">
      <div class="room-head"><h2>퇴마사 대기실</h2><div class="code-box">방 코드 <b id="room-code"></b><button id="btn-copy" class="small">초대 문구 복사</button></div></div>
      <p class="hint" id="invite-hint"></p>
      <div class="room-grid">
        <div>
          <h3>👥 퇴마사 (2명)</h3>
          <div id="room-players" class="room-players"></div>
          <h3>🎖 대장 고르기 <span class="hint">— 대장마다 고유 능력과 필살기가 있어요</span></h3>
          <div id="leader-pick" class="leader-pick"></div>
        </div>
        <div>
          <h3>⚙ 설정</h3>
          <div id="room-settings" class="room-settings"></div>
          <h3>🗺 맵 고르기 <span class="hint" id="map-count"></span></h3>
          <div id="map-filter" class="map-filter"></div>
          <div id="map-list" class="map-list"></div>
        </div>
      </div>
      <div class="room-actions">
        <button id="btn-bot" class="small">🤖 AI 동료 넣기</button>
        <span style="flex:1"></span>
        <button class="btn-guide small">📖 게임 방법</button>
        <button class="btn-codex small">📚 유닛 도감</button>
        <button id="btn-leave" class="small">나가기</button>
        <button id="btn-start" class="primary">출진! ▶</button>
      </div>
      <div class="chat-box"><div id="room-chat" class="chat-log"></div><form class="chat-form" data-chat><input maxlength="200" placeholder="채팅"><button>보내기</button></form></div>
    </div>
  </section>

  <!-- 게임 -->
  <section id="game" class="screen hidden">
    <header id="topbar" class="topbar"></header>
    <div class="game-main">
      <div class="board-col">
        <div id="fieldtabs" class="fieldtabs"></div>
        <div class="board-wrap">
          <div id="sidetabs" class="sidetabs">
            <button data-d="recipe">📜<span>조합법</span><i class="badge hidden"></i></button>
            <button data-d="pick">🎁<span>선택소</span><i class="badge hidden"></i></button>
            <button data-d="mission">🎖<span>미션</span><i class="badge hidden"></i></button>
            <button data-d="story">📖<span>보스 스토리</span><i class="badge hidden"></i></button>
          </div>
          <div id="drawer" class="drawer hidden"></div>
          <div id="storybox" class="storybox hidden"></div>
          <canvas id="board"></canvas>
          <div id="bless" class="bless hidden"></div>
          <div id="herochoice" class="bless hero-pick hidden"></div>
          <div id="banner" class="banner hidden"></div>
        </div>
        <div id="controls" class="controls"></div>
      </div>
      <aside class="side-col">
        <div id="team" class="team"></div>
        <div id="selected" class="selected"></div>
        <div id="nextwave" class="nextwave"></div>
        <div class="tabs"><button data-tab="feed" class="on">소식</button><button data-tab="chat">채팅</button></div>
        <div id="feed" class="feed"></div>
        <div id="chat" class="chat hidden"><div id="game-chat" class="chat-log"></div><form class="chat-form" data-chat><input maxlength="200" placeholder="채팅 (Enter)"><button>보내기</button></form></div>
      </aside>
    </div>
  </section>

  <div id="modal" class="modal hidden"><div class="modal-inner card"></div></div>
  <div id="toast" class="toast hidden"></div>

  <script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.min.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
  <script src="/sound.js"></script>
  <script src="/app.js"></script>
  <script type="module" src="/board3d.js"></script>
</body>
</html>
